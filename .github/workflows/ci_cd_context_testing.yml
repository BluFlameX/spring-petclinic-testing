name: Trying contexts and variables

on:
  push:
    branches:
      - main

jobs:
  context_exploration:
    runs-on: ubuntu-latest
    env:
      global_env_var: Global env variable, will be used while printing
    steps:
      - name: checkout code onto the runner
        uses: actions\checkout@v5
      - name: printing repository context
        run: echo ${{github.repository}}
      - name: printing github actor context
        run: echo ${{github.actor}}
    
  installing_and_compiling_maven:
      runs-on: ubuntu-latest
      steps:
        - name: actual repo checkout
          uses: actions\checkout@v5
        - name: Cleaning target package
          run: mvn clean
        - name: compiling the code
          run: mvn compile

  exploring_variables:
      runs-on: ubuntu-latest
      steps:
        - name: printing global variable
          run: echo ${{env.global_env_var}}
        - name: printing vars goal variable
          run: echo ${{vars.GOAL}}
        